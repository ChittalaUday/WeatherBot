[project]
name = "weatherbot"
version = "0.1.0"
description = "WeatherBot backend and ML pipeline"
authors = [{name = "WeatherBot Team"}]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.notebooks.dependencies]
matplotlib = ">=3.7.0"
seaborn = ">=0.12.0"
ipykernel = ">=6.20.0"
jupyter = ">=1.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.7.0"
pyright = "^1.1.380"
pytest = "^8.0.0"
pytest-asyncio = ">=0.24"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "data",
    "models",
    "frontend",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E731", "E402", "E702", "E741", "B007"]

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "basic"
extraPaths = ["."]
venvPath = "."
venv = ".venv"
include = ["backend", "src", "tests"]
exclude = ["**/__pycache__", ".venv", "data", "models"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["main"]
