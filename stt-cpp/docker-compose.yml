services:
  stt-cpp:
    image: nemo-speech-runtime:cpu
    build:
      context: ./NeMo-Speech.cpp
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        # No NVIDIA GPU here, so drop CUDA and its ggml patch series (the patches
        # target CUDA kernels; the CPU build wants stock upstream ggml).
        ENABLE_CUDA: "OFF"
        ENABLE_CUDA_GRAPHS: "OFF"
        ENABLE_GGML_PATCHES: "OFF"
        # Sparrowhawk normalisation and NMT stay off - each pulls a heavy toolchain into
        # the builder and neither is used.
        ENABLE_HTTP: "ON"
        # Builds the separate riva_server binary (Riva-compatible gRPC) into the same image.
        ENABLE_GRPC: "ON"
        ENABLE_NORM: "OFF"
        ENABLE_NMT: "OFF"
        # Must stay ON despite nothing here using LM-fused decoding: the
        # Dockerfile builds SentencePiece only inside this branch, and the ASR
        # links it unconditionally (src/asr/CMakeLists.txt:101 find_library).
        ENABLE_FLASHLIGHT: "ON"
        # ponytail: 6, not nproc — Docker Desktop has 8 GB and ggml/llama.cpp
        # translation units peak near 1 GB each. Raise if the VM gets more RAM.
        JOBS: "6"
    ports: ["2701:8080"]
    restart: unless-stopped
    # The runtime image is FROM scratch and model-free by design; the GGUF is
    # mounted, not baked in.
    volumes: ["./models:/models:ro"]
    command:
      - serve
      - --host
      - "0.0.0.0"
      - --asr-model
      - /models/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf
      # The browser talks to this from the Next.js origin, not from :2701.
      - --cors-origin
      - "*"
      # Default is 4, and a realtime WebSocket holds one for the whole dictation - so the
      # 5th concurrent mic waits at accept, not in the model. scripts/stt_bench.py showed
      # 15 s connect waits at 16 clients on the default. These threads are idle between
      # audio frames, so overcommitting the 4 CPUs is the point.
      - --threads
      - "32"
    healthcheck:
      # scratch image: no shell, no curl. The CLI ships its own /ready probe.
      test: ["CMD", "/opt/nemo-speech/bin/nemo-speech", "health", "--quiet"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
    deploy:
      resources:
        limits: {cpus: "4", memory: 4g}

  # The Riva-compatible gRPC front end. Same image, the other binary: upstream ships
  # riva_server as a separate process that loads its own copy of the model, so this is a
  # second ~1 GB resident, not a second interface onto the first.
  stt-cpp-grpc:
    image: nemo-speech-runtime:cpu
    depends_on: [stt-cpp]
    entrypoint: ["/opt/nemo-speech/bin/riva_server"]
    # riva_server takes only dotted engine keys - none of `serve`'s --asr-model aliases.
    command:
      - --asr.model.path
      - /models/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf
      # -1 is CPU. Unlike `nemo-speech serve`, riva_server defaults to gpu 0 and then
      # crash-loops on a machine with no CUDA device rather than falling back.
      - --asr.backend.gpu
      - "-1"
      - --bind
      - "0.0.0.0:50051"
    ports: ["50051:50051"]
    restart: unless-stopped
    volumes: ["./models:/models:ro"]
    # No healthcheck: the image is FROM scratch, so there is no shell, curl or grpc_health
    # probe to run inside it, and `nemo-speech health` only speaks HTTP.
    deploy:
      resources:
        limits: {cpus: "4", memory: 4g}
